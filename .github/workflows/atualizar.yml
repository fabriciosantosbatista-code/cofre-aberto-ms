name: Atualizar dados diariamente

on:
  schedule:
    # 07:23 UTC = 04:23 de Brasília. Minuto "quebrado" e madrugada: os horários
    # redondos (ex.: 12:00) são os mais disputados no GitHub e o run chegava a
    # começar 5–10 h atrasado. Assim os dados ficam prontos antes do expediente.
    - cron: '23 7 * * *'
    # Reserva: o GitHub às vezes atrasa muito ou pula execuções agendadas
    # (em 11/11/2026 a das 07:23 UTC não tinha rodado até as 13h). Se as duas
    # rodarem, não há problema: a coleta é idempotente.
    - cron: '47 13 * * *'
  workflow_dispatch:

# Horários gravados nos JSONs ("ultimaAtualizacao") no fuso de MS — sem isso o
# runner usa UTC e uma coleta às 22h de Brasília apareceria com a data do dia seguinte.
env:
  TZ: America/Campo_Grande

# só o necessário: gravar os dados no repositório (a verificação pede issues: write no próprio job)
permissions:
  contents: write
  actions: read   # o ICP lê o log dos robôs desta execução para saber qual coleta falhou

jobs:
  coletar_dados:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar dados
        env:
          PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
        run: python3 scripts/coletar_dados.py

      - name: Histórico do ano que fechou (só na primeira coleta após a virada)
        run: python3 scripts/gerar_historico.py --se-faltar || echo "⚠️ histórico do ano anterior não gerado — tenta de novo amanhã"

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — dados (portal transparência)
        uses: actions/upload-artifact@v4
        with:
          name: dados-portal
          path: |
            dados/**
            !dados/camara_municipal.json
            !dados/verba_cg_cache.json
            !dados/trt24_magistrados.json
            !dados/tre_ms_magistrados.json
            !dados/tjms_magistrados.json
          retention-days: 1

  coletar_verba_camara:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar Verba Indenizatória (Câmara CG)
        run: python3 scripts/coletar_verba_camara_cg.py

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — verba indenizatória (Câmara CG)
        uses: actions/upload-artifact@v4
        with:
          name: dados-verba-camara
          path: |
            dados/camara_municipal.json
            dados/verba_cg_cache.json
            dados/camara_cg_pdfs.json
            dados/historico_*_camara_cg.json
          retention-days: 1

      - name: Deixar só os PDFs da Câmara ainda não guardados (os já guardados saem da pasta temporária)
        run: python3 scripts/pdfs_novos.py

      - name: Guardar os PDFs NOVOS lidos nesta coleta (30 dias; podem ter CPF impresso — não vão para o site)
        uses: actions/upload-artifact@v4
        with:
          name: pdfs-camara-cg-${{ github.run_id }}
          path: pdfs_camara_cg/
          retention-days: 30
          if-no-files-found: ignore

  coletar_trt24:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar remuneração de magistrados (TRT24)
        run: python3 scripts/coletar_trt24.py

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — TRT24
        uses: actions/upload-artifact@v4
        with:
          name: dados-trt24
          path: dados/trt24_magistrados.json
          retention-days: 1

  coletar_tre_ms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar remuneração de magistrados (TRE-MS)
        run: python3 scripts/coletar_tre_ms.py

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — TRE-MS
        uses: actions/upload-artifact@v4
        with:
          name: dados-tre-ms
          path: dados/tre_ms_magistrados.json
          retention-days: 1

  coletar_tjms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar remuneração de magistrados (TJMS)
        run: python3 scripts/coletar_tjms.py

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — TJMS
        uses: actions/upload-artifact@v4
        with:
          name: dados-tjms
          path: dados/tjms_magistrados.json
          retention-days: 1

  coletar_governo_ms:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar despesas, diárias e primeiro escalão (Governo do Estado de MS)
        run: python3 scripts/coletar_governo_ms.py

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — Governo MS
        uses: actions/upload-artifact@v4
        with:
          name: dados-governo-ms
          path: |
            dados/governo_ms.json
            dados/governo_ms_credores.json
          retention-days: 1

  coletar_contratos_cg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar contratos e licitações (Prefeitura de CG)
        run: python3 scripts/coletar_contratos_cg.py

      - name: Shows pagos pelo Estado e pelas prefeituras de MS (PNCP)
        timeout-minutes: 15
        run: python3 -u scripts/coletar_shows.py || echo "⚠️ coletar_shows.py falhou — dados anteriores mantidos"

      # Preços pagos desligado a pedido — para voltar, descomente:
      # - name: Preço unitário pago pelo mesmo item em órgãos de MS (PNCP)
      #   timeout-minutes: 17
      #   run: python3 -u scripts/coletar_precos.py || echo "⚠️ coletar_precos.py falhou — dados anteriores mantidos"

      - name: Aluguel de imóveis (Prefeitura de CG e PNCP) e ligação política dos donos
        timeout-minutes: 15
        run: python3 -u scripts/coletar_alugueis.py || echo "⚠️ coletar_alugueis.py falhou — dados anteriores mantidos"

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — contratos CG
        uses: actions/upload-artifact@v4
        with:
          name: dados-contratos-cg
          path: |
            dados/prefeitura_contratos.json
            dados/shows.json
            dados/shows_cache.json
            dados/precos.json
            dados/precos_cache.json
            dados/alugueis.json
            dados/alugueis_cache.json
          retention-days: 1

  coletar_emendas_alems:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests pypdf

      - name: Coletar emendas por município (arquivo completo da CGU)
        run: python3 scripts/coletar_emendas_municipios.py || echo "⚠️ emendas por município não atualizadas — arquivo anterior mantido"

      - name: Coletar supersalários (DadosJusBr + folha do Estado)
        run: python3 scripts/coletar_supersalarios.py || echo "⚠️ supersalários não atualizados — arquivo anterior mantido"

      - name: Coletar servidores da ALEMS
        run: python3 scripts/coletar_servidores_alems.py || echo "⚠️ servidores da ALEMS não atualizados — arquivo anterior mantido"

      - name: Supersalários — checagem automática da folha completa (todos os contracheques; para se achar CPF)
        id: folha_lgpd
        run: python3 scripts/verificacao/checagem_automatica.py

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — emendas e ALEMS
        uses: actions/upload-artifact@v4
        with:
          name: dados-emendas-alems
          path: |
            dados/emendas_municipios.json
            dados/alems_servidores.json
            dados/supersalarios.json
            dados/verificacao/
          retention-days: 1

      - name: Guardar a folha completa de Supersalários (artefato PRIVADO, 90 dias, sem CPF — base da conferência manual)
        if: steps.folha_lgpd.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: folha-supersalarios-${{ github.run_id }}
          path: folha_completa/
          retention-days: 90
          if-no-files-found: ignore

  coletar_fontes_federais:
    # TSE, Presidência (CGU), STF (DadosJusBr + SICONFI), sanções (CEIS/CNEP) — em paralelo com os outros
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Campanhas dos parlamentares e do Executivo no TSE (1 vez por semana)
        timeout-minutes: 15
        run: python3 scripts/coletar_tse.py --se-velho || echo "⚠️ coletar_tse.py falhou — campanhas anteriores mantidas"

      - name: Sanções da CGU (CEIS e CNEP) das empresas pagas em MS
        timeout-minutes: 10
        run: python3 scripts/coletar_sancoes.py || echo "⚠️ coletar_sancoes.py falhou — sanções anteriores mantidas"

      - name: Presidência da República e transferências da União para MS (CGU)
        timeout-minutes: 30
        run: python3 scripts/coletar_presidencia.py $( [ "$(date +%u)" = "1" ] || echo --rapido ) || echo "⚠️ coletar_presidencia.py falhou — dados anteriores mantidos"

      - name: STF — contracheques dos ministros (DadosJusBr) e despesa com pessoal (SICONFI)
        timeout-minutes: 10
        run: python3 scripts/coletar_stf.py || echo "⚠️ coletar_stf.py falhou — dados anteriores mantidos"

      - name: Votações nominais dos deputados federais e senadores de MS (Câmara e Senado)
        timeout-minutes: 15
        run: python3 -u scripts/coletar_votacoes.py || echo "⚠️ coletar_votacoes.py falhou — dados anteriores mantidos"

      - name: Produção legislativa dos deputados federais e senadores de MS (Câmara e Senado)
        timeout-minutes: 15
        run: python3 -u scripts/coletar_producao_legislativa.py || echo "⚠️ coletar_producao_legislativa.py falhou — dados anteriores mantidos"

      - name: Arrecadação do Governo de MS e da Prefeitura de CG (Tesouro Nacional — Siconfi)
        timeout-minutes: 10
        run: python3 scripts/coletar_receitas.py || echo "⚠️ coletar_receitas.py falhou — dados anteriores mantidos"

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — fontes federais
        uses: actions/upload-artifact@v4
        with:
          name: dados-federais
          path: |
            dados/tse_campanhas.json
            dados/eleicoes.json
            dados/sancoes.json
            dados/presidencia.json
            dados/presidencia_cache.json
            dados/stf.json
            dados/stf_cache.json
            dados/votacoes.json
            dados/votacoes_cache.json
            dados/producao_legislativa.json
            dados/producao_cache.json
            dados/receitas.json
          if-no-files-found: ignore
          retention-days: 1

  coletar_fontes_auditoria:
    # Receita (CNPJ), folha × sócios, contratos/obras/pagadores do Estado, aditivos da Prefeitura e licitações (PNCP)
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Cadastro na Receita das empresas novas (CNPJ, incremental)
        timeout-minutes: 15
        run: python3 scripts/coletar_cnpj.py 400 || echo "⚠️ coletar_cnpj.py falhou — cadastro anterior mantido"

      - name: Servidores do Estado que são sócios de empresas pagas (folha × Receita)
        timeout-minutes: 15
        run: python3 scripts/coletar_servidores_socios.py || echo "⚠️ coletar_servidores_socios.py falhou — cruzamento anterior mantido"

      - name: Contratos e obras do Governo do Estado (+ órgão que paga as empresas acompanhadas)
        timeout-minutes: 30
        run: python3 -u scripts/coletar_contratos_governo.py || echo "⚠️ coletar_contratos_governo.py falhou — contratos anteriores mantidos"

      - name: Aditivos dos contratos da Prefeitura de CG (incremental, 7 dias)
        timeout-minutes: 15
        run: python3 scripts/coletar_aditivos_cg.py || echo "⚠️ coletar_aditivos_cg.py falhou — aditivos anteriores mantidos"

      - name: Licitações dos órgãos estaduais no PNCP (vencedores e preços, incremental)
        timeout-minutes: 30
        run: python3 scripts/coletar_licitacoes_governo.py 800 || echo "⚠️ coletar_licitacoes_governo.py falhou — licitações anteriores mantidas"

      - name: Mascarar CPF antes de entregar os dados deste robô (LGPD — o artefato é baixável)
        id: lgpd
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Upload artifact — fontes da auditoria
        if: always() && steps.lgpd.outcome == 'success'  # nunca envia se a máscara ou o detector de CPF falharam
        uses: actions/upload-artifact@v4
        with:
          name: dados-auditoria
          path: |
            dados/cnpj_cache.json
            dados/servidores_socios.json
            dados/governo_ms_contratos.json
            dados/prefeitura_aditivos.json
            dados/governo_ms_licitacoes.json
            dados/licitacoes_governo_cache.json
          if-no-files-found: ignore
          retention-days: 1

  commit_e_push:
    needs: [coletar_dados, coletar_verba_camara, coletar_trt24, coletar_tre_ms, coletar_tjms, coletar_governo_ms, coletar_contratos_cg, coletar_emendas_alems,
            coletar_fontes_federais, coletar_fontes_auditoria]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pillow (imagens de compartilhamento das páginas)
        run: pip install -q Pillow requests || echo "⚠️ sem Pillow — páginas saem sem cartão"

      - name: Baixar artifact — dados (portal transparência)
        if: needs.coletar_dados.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-portal
          path: dados/

      - name: Baixar artifact — verba indenizatória (Câmara CG)
        if: needs.coletar_verba_camara.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-verba-camara
          path: dados/

      - name: Baixar artifact — TRT24
        if: needs.coletar_trt24.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-trt24
          path: dados/

      - name: Baixar artifact — TRE-MS
        if: needs.coletar_tre_ms.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-tre-ms
          path: dados/

      - name: Baixar artifact — TJMS
        if: needs.coletar_tjms.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-tjms
          path: dados/

      - name: Baixar artifact — Governo MS
        if: needs.coletar_governo_ms.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-governo-ms
          path: dados/

      - name: Baixar artifact — contratos CG
        if: needs.coletar_contratos_cg.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-contratos-cg
          path: dados/

      - name: Baixar artifact — emendas e ALEMS
        if: needs.coletar_emendas_alems.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-emendas-alems
          path: dados/

      - name: Baixar artifact — fontes federais (TSE, sanções, Presidência, STF)
        if: needs.coletar_fontes_federais.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-federais
          path: dados/

      - name: Baixar artifact — fontes da auditoria (Receita, contratos do Estado, PNCP)
        if: needs.coletar_fontes_auditoria.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dados-auditoria
          path: dados/

      - name: Supersalários — inclui a Câmara CG coletada hoje
        run: pip install requests -q && python3 scripts/coletar_supersalarios.py --so-camara || echo "⚠️ Câmara CG fora dos supersalários hoje"

      - name: Mascarar CPF completo de pessoa física nos dados (LGPD)
        run: python3 scripts/mascarar_cpf.py && python3 tests/test_cpf.py  # LGPD: sem CPF, ou o pacote não é enviado

      - name: Limpar o texto (OCR) das notas da verba dos vereadores de CG
        run: python3 scripts/limpar_notas_camara_cg.py || echo "⚠️ limpar_notas_camara_cg.py falhou"

      - name: Conferir a leitura dos PDFs da Câmara de CG (marca para revisão, não muda valores)
        run: python3 scripts/validar_camara_cg.py || echo "⚠️ validar_camara_cg.py falhou"

      - name: Gerar conexões entre fornecedores, evolução mensal e feeds RSS
        run: python3 scripts/gerar_analises.py || echo "⚠️ gerar_analises.py falhou — análises anteriores mantidas"

      - name: Pontos de atenção nos contratos da Prefeitura (+ feed RSS)
        run: python3 scripts/gerar_alertas_contratos.py || echo "⚠️ gerar_alertas_contratos.py falhou — alertas anteriores mantidos"

      - name: Obras atrasadas e paradas do Governo do Estado
        run: python3 scripts/gerar_obras.py || echo "⚠️ gerar_obras.py falhou — dados anteriores mantidos"

      - name: Publicidade do Governo de MS e da Prefeitura de CG
        run: python3 scripts/gerar_publicidade.py || echo "⚠️ gerar_publicidade.py falhou — dados anteriores mantidos"

      - name: Dinheiro público para ONGs e entidades sem fins lucrativos
        run: python3 scripts/gerar_entidades.py || echo "⚠️ gerar_entidades.py falhou — dados anteriores mantidos"

      - name: Auditoria — sinais de atenção (cruza notas, contratos e Receita)
        run: python3 scripts/gerar_auditoria.py || echo "⚠️ gerar_auditoria.py falhou — sinais anteriores mantidos"

      - name: Diárias — comparação entre os órgãos de MS
        run: python3 scripts/gerar_diarias_comparacao.py || echo "⚠️ gerar_diarias_comparacao.py falhou — comparação anterior mantida"

      - name: Gerar planilhas CSV e status das fontes
        run: python3 scripts/gerar_dados_abertos.py || echo "⚠️ gerar_dados_abertos.py falhou — planilhas anteriores mantidas"

      - name: Baixar a folha completa de Supersalários desta coleta (artefato privado; usada só na conferência, fora do Git)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: folha-supersalarios-${{ github.run_id }}
          path: folha_completa/

      - name: Conferir os dados direto nas fontes oficiais (independente da coleta; só entra no ICP até 2 h depois do início da coleta)
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export COLETA_INICIO=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at 2>/dev/null || true)
          python3 -u scripts/validar_fontes.py || echo "⚠️ validar_fontes.py falhou — conferência anterior mantida"

      - name: Marcar servidores de gabinete da Câmara de CG com outro vínculo público
        run: python3 scripts/gerar_acumulos_gabinetes.py || echo "⚠️ gerar_acumulos_gabinetes.py falhou — marcações anteriores mantidas"

      - name: Gerar uma página por parlamentar (+ sitemap)
        run: python3 scripts/gerar_paginas_parlamentares.py || echo "⚠️ gerar_paginas_parlamentares.py falhou — páginas anteriores mantidas"

      - name: Gerar uma página por empresa (+ sitemap)
        run: python3 scripts/gerar_paginas_empresas.py || echo "⚠️ gerar_paginas_empresas.py falhou — páginas anteriores mantidas"

      - name: Gerar uma página por órgão (+ sitemap)
        run: python3 scripts/gerar_paginas_orgaos.py || echo "⚠️ gerar_paginas_orgaos.py falhou — páginas anteriores mantidas"

      - name: Gerar uma página por município (+ sitemap)
        run: python3 scripts/gerar_paginas_municipios.py || echo "⚠️ gerar_paginas_municipios.py falhou — páginas anteriores mantidas"

      - name: Páginas por tema e perguntas frequentes (para as buscas) (+ sitemap)
        run: python3 scripts/gerar_paginas_temas.py || echo "⚠️ gerar_paginas_temas.py falhou — páginas anteriores mantidas"

      - name: Boletim semanal (+ feed RSS e sitemap)
        run: python3 scripts/gerar_boletim.py || echo "⚠️ gerar_boletim.py falhou — boletim anterior mantido"

      - name: Atividade recente — notas novas do dia e da semana
        run: python3 scripts/gerar_atividade.py || echo "⚠️ gerar_atividade.py falhou — atividade anterior mantida"

      - name: Versões leves dos dados para o painel (carregamento rápido no celular)
        run: python3 scripts/gerar_painel_leve.py || echo "⚠️ gerar_painel_leve.py falhou — o painel usa os arquivos completos"

      - name: Atualizar números da capa e das páginas de SEO
        run: python3 scripts/atualizar_paginas.py || echo "⚠️ atualizar_paginas.py falhou — páginas estáticas mantidas"

      - name: LGPD — última passada da máscara de CPF nos dados e nas páginas geradas
        run: python3 scripts/mascarar_cpf.py --paginas

      - name: Proteger a publicação — CPF, integridade, formato e variações antes de publicar (falhou = mantém a versão publicada)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export COLETA_INICIO=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at 2>/dev/null || true)
          python3 scripts/proteger_publicacao.py

      - name: ICP — registro da execução dos robôs (logs reais), notas e páginas /confiabilidade/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export COLETA_INICIO=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at 2>/dev/null || true)
          python3 scripts/registrar_execucao.py || echo "⚠️ registrar_execucao.py falhou — execução registrada como não verificada"
          python3 scripts/gerar_icp.py || echo "⚠️ gerar_icp.py falhou — índice anterior mantido"
          python3 scripts/gerar_icp.py --sitemap || echo "⚠️ sitemap do ICP não atualizado"
          python3 scripts/mascarar_cpf.py --paginas
          python3 tests/test_cpf.py

      - name: Guardar as evidências da coleta bloqueada
        if: hashFiles('bloqueio/relatorio.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coleta-bloqueada-${{ github.run_id }}
          path: bloqueio/
          retention-days: 30

      - name: Commit e push
        run: |
          git config user.name "Cofre Aberto Bot"
          git config user.email "bot@cofreabertoms.com.br"
          git add $(grep -v "^#" .github/publicar.txt)   # mesma lista que proteger_publicacao.py reverte quando a coleta falha

          if git diff --staged --quiet; then
            echo "Sem mudanças"
            exit 0
          fi

          BASE_COLETA=$(git rev-parse HEAD)   # o main sobre o qual o ICP desta coleta foi calculado
          git commit -m "🤖 Dados atualizados — $(date +'%d/%m/%Y %H:%M') BRT"

          ARQUIVOS_MANUAIS="dados/camara_municipal.json dados/verba_cg_cache.json"

          resolver_conflitos() {
            for f in $(git diff --name-only --diff-filter=U); do
              manter_manual=0
              for m in $ARQUIVOS_MANUAIS; do
                [ "$f" = "$m" ] && manter_manual=1
              done
              if [ "${f##*.}" = "jsonl" ]; then
                # histórico que só cresce: une as linhas das duas versões (nenhuma linha é perdida)
                echo "  Conflito em $f — unindo as linhas das duas versões (histórico permanente)"
                git show ":2:$f" > /tmp/hist_a 2>/dev/null || : > /tmp/hist_a
                git show ":3:$f" > /tmp/hist_b 2>/dev/null || : > /tmp/hist_b
                python3 -c "import sys;a=open('/tmp/hist_a').read().splitlines();b=open('/tmp/hist_b').read().splitlines();v=set(a);open(sys.argv[1],'w').write('\n'.join(a+[l for l in b if l not in v])+'\n')" "$f"
              elif [ "$manter_manual" = "1" ]; then
                echo "  Conflito em $f — mantendo versão do repositório (--ours)"
                git checkout --ours -- "$f"
              else
                echo "  Conflito em $f — usando versão nova coletada pelo bot (--theirs)"
                git checkout --theirs -- "$f"
              fi
              git add "$f"
            done
          }

          sincronizar() {
            git pull --rebase origin main && return 0
            tentativas=0
            while git diff --name-only --diff-filter=U | grep -q . && [ "$tentativas" -lt 5 ]; do
              tentativas=$((tentativas + 1))
              resolver_conflitos
              GIT_EDITOR=true git rebase --continue && return 0
            done
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "❌ Conflito não resolvido automaticamente — abortando rebase"
              git rebase --abort
              return 1
            fi
            return 0
          }

          sincronizar || (echo "Tentando novamente em 10s..." && sleep 10 && sincronizar) || { echo "❌ Falha ao sincronizar com origin/main"; exit 1; }

          # Se entrou no main, durante a coleta, commit que mexe no que o ICP lê (históricos, conferências, scripts),
          # o icp.json desta coleta ficou calculado sobre o histórico antigo, enquanto os históricos .jsonl foram unidos
          # (18/11/2026: F das bases não batia com o histórico e o teste do ICP falhou). Recalcula sobre o main unido.
          if git diff --name-only "$BASE_COLETA" origin/main -- dados/icp_execucoes_historico.jsonl dados/icp_verificacoes.jsonl \
               dados/icp_anotacoes.json dados/validacao_fontes.json scripts/ | grep -q .; then
            echo "ℹ️ O main mudou durante a coleta em arquivos que o ICP lê — recalculando o ICP sobre a versão unida"
            python3 scripts/gerar_icp.py && python3 scripts/gerar_icp.py --sitemap && python3 scripts/mascarar_cpf.py --paginas && python3 tests/test_cpf.py \
              || { echo "❌ Recalcular o ICP após sincronizar falhou"; exit 1; }
            git add $(grep -v "^#" .github/publicar.txt)
            if ! git diff --staged --quiet; then
              git commit -m "🤖 ICP recalculado sobre o main unido — $(date +'%d/%m/%Y %H:%M') BRT"
              sincronizar || { echo "❌ Falha ao sincronizar com origin/main"; exit 1; }
            fi
          fi
          git push origin main

  # ------------------------------------------------------------------
  # Saúde dos dados + teste do painel. Os coletores mantêm o dado antigo
  # quando a fonte falha, então "sucesso" na coleta não garante dado novo:
  # este job olha o conteúdo, abre/atualiza a issue "alerta-dados" e falha
  # o run (e-mail do GitHub) se houver erro.
  # ------------------------------------------------------------------
      - name: Avisar buscadores das páginas que mudaram (IndexNow — Bing, DuckDuckGo, Yahoo)
        continue-on-error: true
        run: python3 scripts/avisar_buscadores.py || echo "⚠️ aviso aos buscadores falhou — sem impacto no site"

  verificar:
    needs: [commit_e_push]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (versão recém-publicada)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Verificar saúde dos dados
        id: dados
        continue-on-error: true
        run: python3 scripts/verificar_dados.py --relatorio relatorio.md

      - name: Conferir as contas dos dados publicados (somas e totais)
        id: integridade
        continue-on-error: true
        run: |
          python3 tests/test_integridade_dados.py | tee integridade.log
          exit ${PIPESTATUS[0]}

      - name: Variações, formato, fontes paradas, PDFs e exposição de dados
        id: variacoes
        continue-on-error: true
        run: python3 tests/test_variacoes.py --relatorio relatorio.md

      - name: Monitoramento dos robôs — leitura de logs e estados (logs sintéticos)
        id: robos
        continue-on-error: true
        run: |
          pip install -q requests
          python3 tests/test_monitoramento_robos.py --rapido | tee -a relatorio.md; exit ${PIPESTATUS[0]}

      - name: ICP — notas, status e histórico conferidos
        id: icp
        continue-on-error: true
        run: |
          python3 tests/test_icp.py | tee -a relatorio.md; a=${PIPESTATUS[0]}
          python3 tests/test_icp_metodologia.py | tee -a relatorio.md; b=${PIPESTATUS[0]}
          exit $(( a || b ))

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          # o apt dos runners às vezes falha por DNS: tenta de novo antes de desistir
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "⚠️ instalação do Chromium falhou (tentativa $i) — tentando de novo em 30 s"
            sleep 30; sudo apt-get update -q || true
          done
          npx playwright install chromium

      - name: Testar o painel (todas as abas e parlamentares)
        id: site
        continue-on-error: true
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node tests/smoke.js http://localhost:8000/ | tee smoke.log

      - name: Abrir / atualizar / fechar a issue de alerta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="alerta-dados"
          gh label create "$LABEL" --color D93F0B --description "Alerta automático: dado parado ou site com erro" 2>/dev/null || true
          {
            cat relatorio.md
            if [ "${{ steps.integridade.outcome }}" != "success" ]; then
              echo; echo "## ❌ Contas dos dados não fecham"; echo; grep -E "^❌" integridade.log | head -30 | sed 's/^/- /'
            fi
            if [ "${{ steps.site.outcome }}" != "success" ]; then
              echo; echo "## ❌ Teste do painel falhou"; echo; echo '```'
              grep -E "❌" smoke.log | head -40 || echo "(veja o log do run)"
              echo '```'
            fi
            echo; echo "Run: $RUN_URL"
          } > corpo.md
          NUM=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ "${{ steps.dados.outcome }}" != "success" ] || [ "${{ steps.site.outcome }}" != "success" ] || [ "${{ steps.variacoes.outcome }}" != "success" ] || [ "${{ steps.integridade.outcome }}" != "success" ] || [ "${{ steps.icp.outcome }}" != "success" ] || [ "${{ steps.robos.outcome }}" != "success" ]; then
            if [ -n "$NUM" ]; then
              ANTES=$(gh issue view "$NUM" --json body --jq .body | grep -E "^- \*\*|❌ \[" | sort)
              DEPOIS=$(grep -E "^- \*\*|❌ \[" corpo.md | grep -v "^- \*\*Câmara de " | sort)
              gh issue edit "$NUM" --body-file corpo.md
              # só notifica (comentário) quando a lista de problemas muda
              if [ "$(echo "$ANTES" | grep -v '^- \*\*Câmara de ')" != "$DEPOIS" ]; then
                gh issue comment "$NUM" --body "A lista de problemas mudou nesta coleta — veja a descrição atualizada. $RUN_URL"
              fi
            else
              gh issue create --title "⚠️ Alerta de dados — Cofre Aberto MS" --label "$LABEL" --body-file corpo.md
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "✅ Tudo normalizado nesta coleta ($(date -u +%d/%m/%Y)). $RUN_URL"
          fi

      - name: Resultado
        run: |
          echo "Dados: ${{ steps.dados.outcome }} — Painel: ${{ steps.site.outcome }}"
          cat relatorio.md >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.dados.outcome }}" = "success" ] && [ "${{ steps.site.outcome }}" = "success" ]
