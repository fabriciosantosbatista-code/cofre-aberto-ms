name: Atualizar dados diariamente

on:
  schedule:
    # 07:23 UTC = 04:23 de Brasília. Minuto "quebrado" e madrugada: os horários
    # redondos (ex.: 12:00) são os mais disputados no GitHub e o run chegava a
    # começar 5–10 h atrasado. Assim os dados ficam prontos antes do expediente.
    - cron: '23 7 * * *'
    # Reserva: o GitHub às vezes atrasa muito ou pula execuções agendadas
    # (em 11/11/2026 a das 07:23 UTC não tinha rodado até as 13h). Se as duas
    # rodarem, não há problema: a coleta é idempotente.
    - cron: '47 13 * * *'
  workflow_dispatch:

# Horários gravados nos JSONs ("ultimaAtualizacao") no fuso de MS — sem isso o
# runner usa UTC e uma coleta às 22h de Brasília apareceria com a data do dia seguinte.
env:
  TZ: America/Campo_Grande

jobs:
  coletar_dados:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar dados
        env:
          PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
        run: python3 scripts/coletar_dados.py

      - name: Histórico do ano que fechou (só na primeira coleta após a virada)
        run: python3 scripts/gerar_historico.py --se-faltar || echo "⚠️ histórico do ano anterior não gerado — tenta de novo amanhã"

      - name: Upload artifact — dados (portal transparência)
        uses: actions/upload-artifact@v4
        with:
          name: dados-portal
          path: |
            dados/**
            !dados/camara_municipal.json
            !dados/verba_cg_cache.json
            !dados/trt24_magistrados.json
            !dados/tre_ms_magistrados.json
            !dados/tjms_magistrados.json
          retention-days: 1

  coletar_verba_camara:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar Verba Indenizatória (Câmara CG)
        run: python3 scripts/coletar_verba_camara_cg.py

      - name: Upload artifact — verba indenizatória (Câmara CG)
        uses: actions/upload-artifact@v4
        with:
          name: dados-verba-camara
          path: |
            dados/camara_municipal.json
            dados/verba_cg_cache.json
            dados/historico_*_camara_cg.json
          retention-days: 1

  coletar_trt24:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar remuneração de magistrados (TRT24)
        run: python3 scripts/coletar_trt24.py

      - name: Upload artifact — TRT24
        uses: actions/upload-artifact@v4
        with:
          name: dados-trt24
          path: dados/trt24_magistrados.json
          retention-days: 1

  coletar_tre_ms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar remuneração de magistrados (TRE-MS)
        run: python3 scripts/coletar_tre_ms.py

      - name: Upload artifact — TRE-MS
        uses: actions/upload-artifact@v4
        with:
          name: dados-tre-ms
          path: dados/tre_ms_magistrados.json
          retention-days: 1

  coletar_tjms:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests Pillow pypdf

      - name: Coletar remuneração de magistrados (TJMS)
        run: python3 scripts/coletar_tjms.py

      - name: Upload artifact — TJMS
        uses: actions/upload-artifact@v4
        with:
          name: dados-tjms
          path: dados/tjms_magistrados.json
          retention-days: 1

  coletar_governo_ms:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar despesas, diárias e primeiro escalão (Governo do Estado de MS)
        run: python3 scripts/coletar_governo_ms.py

      - name: Upload artifact — Governo MS
        uses: actions/upload-artifact@v4
        with:
          name: dados-governo-ms
          path: |
            dados/governo_ms.json
            dados/governo_ms_credores.json
          retention-days: 1

  coletar_contratos_cg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Coletar contratos e licitações (Prefeitura de CG)
        run: python3 scripts/coletar_contratos_cg.py

      - name: Upload artifact — contratos CG
        uses: actions/upload-artifact@v4
        with:
          name: dados-contratos-cg
          path: dados/prefeitura_contratos.json
          retention-days: 1

  coletar_emendas_alems:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests pypdf

      - name: Coletar emendas por município (arquivo completo da CGU)
        run: python3 scripts/coletar_emendas_municipios.py || echo "⚠️ emendas por município não atualizadas — arquivo anterior mantido"

      - name: Coletar supersalários (DadosJusBr + folha do Estado)
        run: python3 scripts/coletar_supersalarios.py || echo "⚠️ supersalários não atualizados — arquivo anterior mantido"

      - name: Coletar servidores da ALEMS
        run: python3 scripts/coletar_servidores_alems.py || echo "⚠️ servidores da ALEMS não atualizados — arquivo anterior mantido"

      - name: Upload artifact — emendas e ALEMS
        uses: actions/upload-artifact@v4
        with:
          name: dados-emendas-alems
          path: |
            dados/emendas_municipios.json
            dados/alems_servidores.json
            dados/supersalarios.json
          retention-days: 1

  commit_e_push:
    needs: [coletar_dados, coletar_verba_camara, coletar_trt24, coletar_tre_ms, coletar_tjms, coletar_governo_ms, coletar_contratos_cg, coletar_emendas_alems]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Baixar artifact — dados (portal transparência)
        if: needs.coletar_dados.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-portal
          path: dados/

      - name: Baixar artifact — verba indenizatória (Câmara CG)
        if: needs.coletar_verba_camara.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-verba-camara
          path: dados/

      - name: Baixar artifact — TRT24
        if: needs.coletar_trt24.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-trt24
          path: dados/

      - name: Baixar artifact — TRE-MS
        if: needs.coletar_tre_ms.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-tre-ms
          path: dados/

      - name: Baixar artifact — TJMS
        if: needs.coletar_tjms.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-tjms
          path: dados/

      - name: Baixar artifact — Governo MS
        if: needs.coletar_governo_ms.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-governo-ms
          path: dados/

      - name: Baixar artifact — contratos CG
        if: needs.coletar_contratos_cg.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-contratos-cg
          path: dados/

      - name: Baixar artifact — emendas e ALEMS
        if: needs.coletar_emendas_alems.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: dados-emendas-alems
          path: dados/

      - name: Supersalários — inclui a Câmara CG coletada hoje
        run: pip install requests -q && python3 scripts/coletar_supersalarios.py --so-camara || echo "⚠️ Câmara CG fora dos supersalários hoje"

      - name: Gerar conexões entre fornecedores, evolução mensal e feeds RSS
        run: python3 scripts/gerar_analises.py || echo "⚠️ gerar_analises.py falhou — análises anteriores mantidas"

      - name: Pontos de atenção nos contratos da Prefeitura (+ feed RSS)
        run: python3 scripts/gerar_alertas_contratos.py || echo "⚠️ gerar_alertas_contratos.py falhou — alertas anteriores mantidos"

      - name: Cadastro na Receita das empresas novas (CNPJ, incremental)
        timeout-minutes: 15
        run: python3 scripts/coletar_cnpj.py 400 || echo "⚠️ coletar_cnpj.py falhou — cadastro anterior mantido"

      - name: Campanhas dos parlamentares no TSE (doadores e fornecedores; 1 vez por semana)
        timeout-minutes: 15
        run: python3 scripts/coletar_tse.py --se-velho || echo "⚠️ coletar_tse.py falhou — campanhas anteriores mantidas"

      - name: Servidores do Estado que são sócios de empresas pagas (folha × Receita)
        timeout-minutes: 15
        run: python3 scripts/coletar_servidores_socios.py || echo "⚠️ coletar_servidores_socios.py falhou — cruzamento anterior mantido"

      - name: Sanções da CGU (CEIS e CNEP) das empresas pagas em MS
        timeout-minutes: 10
        run: python3 scripts/coletar_sancoes.py || echo "⚠️ coletar_sancoes.py falhou — sanções anteriores mantidas"

      - name: Contratos e obras do Governo do Estado (+ órgão que paga as empresas acompanhadas)
        timeout-minutes: 30
        run: python3 scripts/coletar_contratos_governo.py || echo "⚠️ coletar_contratos_governo.py falhou — contratos anteriores mantidos"

      - name: Aditivos dos contratos da Prefeitura de CG (incremental, 7 dias)
        timeout-minutes: 20
        run: python3 scripts/coletar_aditivos_cg.py || echo "⚠️ coletar_aditivos_cg.py falhou — aditivos anteriores mantidos"

      - name: Presidência da República e transferências da União para MS (CGU)
        timeout-minutes: 30
        run: python3 scripts/coletar_presidencia.py $( [ "$(date +%u)" = "1" ] || echo --rapido ) || echo "⚠️ coletar_presidencia.py falhou — dados anteriores mantidos"

      - name: Auditoria — sinais de atenção (cruza notas, contratos e Receita)
        run: python3 scripts/gerar_auditoria.py || echo "⚠️ gerar_auditoria.py falhou — sinais anteriores mantidos"

      - name: Diárias — comparação entre os órgãos de MS
        run: python3 scripts/gerar_diarias_comparacao.py || echo "⚠️ gerar_diarias_comparacao.py falhou — comparação anterior mantida"

      - name: Gerar planilhas CSV e status das fontes
        run: python3 scripts/gerar_dados_abertos.py || echo "⚠️ gerar_dados_abertos.py falhou — planilhas anteriores mantidas"

      - name: Gerar uma página por parlamentar (+ sitemap)
        run: python3 scripts/gerar_paginas_parlamentares.py || echo "⚠️ gerar_paginas_parlamentares.py falhou — páginas anteriores mantidas"

      - name: Gerar uma página por empresa (+ sitemap)
        run: python3 scripts/gerar_paginas_empresas.py || echo "⚠️ gerar_paginas_empresas.py falhou — páginas anteriores mantidas"

      - name: Gerar uma página por órgão (+ sitemap)
        run: python3 scripts/gerar_paginas_orgaos.py || echo "⚠️ gerar_paginas_orgaos.py falhou — páginas anteriores mantidas"

      - name: Boletim semanal (+ feed RSS e sitemap)
        run: python3 scripts/gerar_boletim.py || echo "⚠️ gerar_boletim.py falhou — boletim anterior mantido"

      - name: Versões leves dos dados para o painel (carregamento rápido no celular)
        run: python3 scripts/gerar_painel_leve.py || echo "⚠️ gerar_painel_leve.py falhou — o painel usa os arquivos completos"

      - name: Atualizar números da capa e das páginas de SEO
        run: python3 scripts/atualizar_paginas.py || echo "⚠️ atualizar_paginas.py falhou — páginas estáticas mantidas"

      - name: Commit e push
        run: |
          git config user.name "Cofre Aberto Bot"
          git config user.email "bot@cofreabertoms.com.br"
          git add dados/ index.html vereadores-campo-grande.html deputados-estaduais-ms.html senadores-ms.html press.html PRESS.md \
                  vereador/ deputado-estadual/ deputado-federal/ senador/ empresa/ orgao/ boletim/ fotos/p/ sitemap.xml

          if git diff --staged --quiet; then
            echo "Sem mudanças"
            exit 0
          fi

          git commit -m "🤖 Dados atualizados — $(date +'%d/%m/%Y %H:%M') BRT"

          ARQUIVOS_MANUAIS="dados/camara_municipal.json dados/verba_cg_cache.json"

          resolver_conflitos() {
            for f in $(git diff --name-only --diff-filter=U); do
              manter_manual=0
              for m in $ARQUIVOS_MANUAIS; do
                [ "$f" = "$m" ] && manter_manual=1
              done
              if [ "$manter_manual" = "1" ]; then
                echo "  Conflito em $f — mantendo versão do repositório (--ours)"
                git checkout --ours -- "$f"
              else
                echo "  Conflito em $f — usando versão nova coletada pelo bot (--theirs)"
                git checkout --theirs -- "$f"
              fi
              git add "$f"
            done
          }

          sincronizar() {
            git pull --rebase origin main && return 0
            tentativas=0
            while git diff --name-only --diff-filter=U | grep -q . && [ "$tentativas" -lt 5 ]; do
              tentativas=$((tentativas + 1))
              resolver_conflitos
              GIT_EDITOR=true git rebase --continue && return 0
            done
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "❌ Conflito não resolvido automaticamente — abortando rebase"
              git rebase --abort
              return 1
            fi
            return 0
          }

          sincronizar || (echo "Tentando novamente em 10s..." && sleep 10 && sincronizar) || { echo "❌ Falha ao sincronizar com origin/main"; exit 1; }
          git push origin main

  # ------------------------------------------------------------------
  # Saúde dos dados + teste do painel. Os coletores mantêm o dado antigo
  # quando a fonte falha, então "sucesso" na coleta não garante dado novo:
  # este job olha o conteúdo, abre/atualiza a issue "alerta-dados" e falha
  # o run (e-mail do GitHub) se houver erro.
  # ------------------------------------------------------------------
  verificar:
    needs: [commit_e_push]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout (versão recém-publicada)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - name: Verificar saúde dos dados
        id: dados
        continue-on-error: true
        run: python3 scripts/verificar_dados.py --relatorio relatorio.md

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          # o apt dos runners às vezes falha por DNS: tenta de novo antes de desistir
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "⚠️ instalação do Chromium falhou (tentativa $i) — tentando de novo em 30 s"
            sleep 30; sudo apt-get update -q || true
          done
          npx playwright install chromium

      - name: Testar o painel (todas as abas e parlamentares)
        id: site
        continue-on-error: true
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node tests/smoke.js http://localhost:8000/ | tee smoke.log

      - name: Abrir / atualizar / fechar a issue de alerta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          LABEL="alerta-dados"
          gh label create "$LABEL" --color D93F0B --description "Alerta automático: dado parado ou site com erro" 2>/dev/null || true
          {
            cat relatorio.md
            if [ "${{ steps.site.outcome }}" != "success" ]; then
              echo; echo "## ❌ Teste do painel falhou"; echo; echo '```'
              grep -E "❌" smoke.log | head -40 || echo "(veja o log do run)"
              echo '```'
            fi
            echo; echo "Run: $RUN_URL"
          } > corpo.md
          NUM=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ "${{ steps.dados.outcome }}" != "success" ] || [ "${{ steps.site.outcome }}" != "success" ]; then
            if [ -n "$NUM" ]; then
              ANTES=$(gh issue view "$NUM" --json body --jq .body | grep -E "^- \*\*|❌ \[" | sort)
              DEPOIS=$(grep -E "^- \*\*|❌ \[" corpo.md | grep -v "^- \*\*Câmara de " | sort)
              gh issue edit "$NUM" --body-file corpo.md
              # só notifica (comentário) quando a lista de problemas muda
              if [ "$(echo "$ANTES" | grep -v '^- \*\*Câmara de ')" != "$DEPOIS" ]; then
                gh issue comment "$NUM" --body "A lista de problemas mudou nesta coleta — veja a descrição atualizada. $RUN_URL"
              fi
            else
              gh issue create --title "⚠️ Alerta de dados — Cofre Aberto MS" --label "$LABEL" --body-file corpo.md
            fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "✅ Tudo normalizado nesta coleta ($(date -u +%d/%m/%Y)). $RUN_URL"
          fi

      - name: Resultado
        run: |
          echo "Dados: ${{ steps.dados.outcome }} — Painel: ${{ steps.site.outcome }}"
          cat relatorio.md >> "$GITHUB_STEP_SUMMARY"
          [ "${{ steps.dados.outcome }}" = "success" ] && [ "${{ steps.site.outcome }}" = "success" ]
