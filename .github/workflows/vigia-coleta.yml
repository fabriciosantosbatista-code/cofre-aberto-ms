name: Vigia da coleta

# A cada 2 h, confere se a coleta diária está em dia. O GitHub às vezes pula ou atrasa horas as execuções agendadas.
# Dispara UMA coleta ("Atualizar dados diariamente") só se TODAS as condições valerem:
#   - dados/status.json com mais de 18 h e nenhuma coleta concluída com sucesso nas últimas 18 h;
#   - nenhuma coleta rodando ou na fila (a execução-fantasma 43097980293 é ignorada);
#   - menos de 2 coletas manuais (workflow_dispatch, contando as do próprio vigia) no dia, no horário de Campo Grande;
#   - as 2 últimas coletas concluídas não falharam. Se falharam, não dispara e falha este job (e-mail do GitHub):
#     "se a coleta falhar 2 vezes seguidas, pare e me avise";
#   - se a última coleta concluída falhou, só dispara se entrou commit no main depois dela (correção).
# Não grava nada no repositório.
on:
  schedule:
    - cron: '19 */2 * * *'   # minuto quebrado, a cada 2 h
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # para disparar a coleta

concurrency:
  group: vigia-coleta
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: dados/status.json
          sparse-checkout-cone-mode: false
      - name: Conferir e, se preciso, disparar a coleta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, sys
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          CG, REPO, FANTASMA = ZoneInfo("America/Campo_Grande"), os.environ["REPO"], 43097980293
          agora = datetime.now(timezone.utc)
          def gh(*a):
              return json.loads(subprocess.run(["gh", "api", *a], capture_output=True, text=True, check=True).stdout or "{}")
          runs = [r for r in gh(f"repos/{REPO}/actions/workflows/atualizar.yml/runs?per_page=30")["workflow_runs"] if r["id"] != FANTASMA]
          quando = lambda r: datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
          try:
              st = json.load(open("dados/status.json", encoding="utf-8"))["ultimaAtualizacao"]
              idade = agora - datetime.fromisoformat(st).replace(tzinfo=CG)
          except Exception as e:
              print(f"⚠️ status.json ilegível ({type(e).__name__}): uso só o histórico de execuções"); idade = None
          rodando = [r for r in runs if r["status"] in ("queued", "in_progress", "waiting", "requested", "pending")]
          concluidas = [r for r in runs if r["status"] == "completed" and r["conclusion"] not in ("cancelled", "skipped")]
          sucesso = [r for r in concluidas if r["conclusion"] == "success"]
          ult_ok = max((datetime.fromisoformat(r["updated_at"].replace("Z", "+00:00")) for r in sucesso), default=None)
          hoje = agora.astimezone(CG).date()
          manuais = [r for r in runs if r["event"] == "workflow_dispatch" and quando(r).astimezone(CG).date() == hoje]
          h = lambda d: "—" if d is None else f"{d.total_seconds() / 3600:.1f} h"
          print(f"status.json: {h(idade)} · última coleta com sucesso: {h(agora - ult_ok if ult_ok else None)} · rodando/fila: {len(rodando)}"
                f" · manuais hoje ({hoje:%d/%m}): {len(manuais)}/2")
          em_dia = (idade is not None and idade < timedelta(hours=18)) or (ult_ok and agora - ult_ok < timedelta(hours=18))
          if em_dia:
              print("✅ coleta em dia — nada a fazer"); sys.exit(0)
          if rodando:
              print(f"⏳ coleta {rodando[0]['id']} em andamento ({rodando[0]['status']}) — não disparo outra"); sys.exit(0)
          if len(manuais) >= 2:
              print("⚠️ limite de 2 coletas manuais hoje já usado — não disparo"); sys.exit(1)
          if len(concluidas) >= 2 and all(r["conclusion"] == "failure" for r in concluidas[:2]):
              print(f"❌ as 2 últimas coletas falharam ({concluidas[0]['id']}, {concluidas[1]['id']}) — não disparo; precisa de correção"); sys.exit(1)
          if concluidas and concluidas[0]["conclusion"] == "failure":
              commits = gh(f"repos/{REPO}/commits?sha=main&since={concluidas[0]['updated_at']}&per_page=5")
              humanos = [c for c in (commits if isinstance(commits, list) else []) if "Dados atualizados" not in (c["commit"]["message"] or "")]
              if not humanos:
                  print(f"⚠️ a última coleta ({concluidas[0]['id']}) falhou e não entrou correção depois — não disparo"); sys.exit(1)
          subprocess.run(["gh", "api", "-X", "POST", f"repos/{REPO}/actions/workflows/atualizar.yml/dispatches", "-f", "ref=main"], check=True)
          print("🔁 coleta disparada pelo vigia (conta no limite de 2 manuais por dia)")
          EOF
