name: Diagnóstico PDFs Câmara CG

# Manual: mostra no log, página a página, como o leitor interpreta os PDFs de
# verba indenizatória de alguns vereadores. Não altera dados nem faz commit.
on:
  workflow_dispatch:
    inputs:
      alvos:
        description: 'Vereador:ato separados por vírgula (ex.: CARLÃO:027,PAPY:028)'
        required: true
        default: 'CARLÃO:027,FLÁVIO CABO ALMI:028,PAPY:028,DR. VICTOR ROCHA:027'

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pypdf
      - name: Diagnóstico
        env:
          ALVOS: ${{ inputs.alvos }}
        run: |
          IFS=',' read -ra A <<< "$ALVOS"
          python3 scripts/diagnostico_pdf_cg.py "${A[@]}"
