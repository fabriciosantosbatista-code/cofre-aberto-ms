name: Diagnóstico de URL

# Manual: busca URLs a partir dos servidores do GitHub (que alcançam portais em
# IP:porta e HTTP simples, como o da Câmara CG) e mostra o começo da resposta.
# Não altera dados nem faz commit.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs separadas por espaço'
        required: true

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Buscar
        env:
          URLS: ${{ inputs.urls }}
        run: |
          for u in $URLS; do
            echo "================ $u"
            curl -sS -m 180 -A "Mozilla/5.0 (CofreAbertoMS)" -o resp.bin -w "HTTP %{http_code} · %{size_download} bytes · %{time_total}s\n" "$u" || true
            head -c 3000 resp.bin; echo
            python3 - <<'PY' || true
          import json
          try:
              d = json.load(open("resp.bin", encoding="utf-8-sig"))
              if isinstance(d, list):
                  print(f"JSON: lista com {len(d)} itens; campos: {list(d[0].keys()) if d else []}")
          except Exception as e:
              print("não é JSON:", str(e)[:120])
          PY
          done
