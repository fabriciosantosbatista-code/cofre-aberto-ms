name: Diagnóstico de URL

# Manual: busca URLs a partir dos servidores do GitHub (que alcançam portais em
# IP:porta e HTTP simples, como o da Câmara CG) e mostra o começo da resposta.
# Não altera dados nem faz commit.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'URLs separadas por espaço'
        required: true
      termo:
        description: 'Opcional: conta e mostra itens do JSON que contêm este termo (sem acento, maiúsculas)'
        required: false
        default: ''
      texto:
        description: 'Opcional: quantos caracteres mostrar do texto da página, sem as tags HTML (ex.: 40000)'
        required: false
        default: ''

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Buscar
        env:
          URLS: ${{ inputs.urls }}
          TERMO: ${{ inputs.termo }}
          TEXTO: ${{ inputs.texto }}
        run: |
          for u in $URLS; do
            echo "================ $u"
            curl -sS -m 180 -A "Mozilla/5.0 (CofreAbertoMS)" -o resp.bin -w "HTTP %{http_code} · %{size_download} bytes · %{time_total}s\n" "$u" || true
            if [ -n "$TEXTO" ]; then
              python3 -c "import re;s=open('resp.bin',encoding='utf-8',errors='ignore').read();print('LINKS:');[print(' ',u) for u in sorted(set(re.findall(r'(?:href|src|data-src)=[\x22\x27]([^\x22\x27]+\.(?:pdf|xlsx?|csv|ods|json|zip)[^\x22\x27]*)',s,re.I)))];i=s.find('CNPJ');print('TRECHO EM VOLTA DE CNPJ:', s[max(0,i-1500):i+2500] if i>=0 else 'nenhum')"
              python3 -c "import re,html,os;s=open('resp.bin',encoding='utf-8',errors='ignore').read();s=re.sub(r'(?is)<(script|style).*?</\\1>','',s);s=re.sub(r'(?i)</t[dh]>',' | ',s);s=re.sub(r'(?i)</tr>','\\n',s);s=html.unescape(re.sub(r'<[^>]+>',' ',s));s=re.sub(r'[ \\t]+',' ',s);s=re.sub(r'\\n\\s*\\n+','\\n',s);print(s[:int(os.environ['TEXTO'])])"
            else
              head -c 3000 resp.bin; echo
            fi
            python3 - <<'PY' || true
          import json, os, unicodedata
          try:
              d = json.load(open("resp.bin", encoding="utf-8-sig"))
              if isinstance(d, list):
                  print(f"JSON: lista com {len(d)} itens; campos: {list(d[0].keys()) if d else []}")
                  termo = os.environ.get("TERMO", "").strip().upper()
                  if termo:
                      sa = lambda t: unicodedata.normalize("NFD", str(t)).encode("ascii", "ignore").decode().upper()
                      achados = [x for x in d if termo in sa(json.dumps(x, ensure_ascii=False))]
                      print(f"itens com '{termo}': {len(achados)}")
                      for x in achados[:15]:
                          print("  ", json.dumps(x, ensure_ascii=False)[:400])
          except Exception as e:
              print("não é JSON:", str(e)[:120])
          PY
          done
