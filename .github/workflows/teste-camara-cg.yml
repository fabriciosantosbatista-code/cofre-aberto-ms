name: Câmara CG — dupla extração (teste, sem publicar)

# Roda a coleta da verba indenizatória da Câmara de CG com a dupla extração (camada de texto + OCR) e a conferência da
# leitura, SEM gravar nada no repositório, e mostra só as contagens no log. Não gera imagens nem artefato: as páginas
# (que podem ter CPF impresso) vão só para o repositório privado, pelo workflow "Câmara CG — páginas para leitura".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências (Python, OCR)
        run: |
          pip install -q requests Pillow pypdf
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils >/dev/null
      - name: Coleta da Câmara CG com a dupla extração (todos os PDFs relidos)
        env:
          CAMARA_ORCAMENTO_RELEITURA_MIN: "80"  # o teste tem 120 min; a coleta diária usa 55
        run: python3 -u scripts/coletar_verba_camara_cg.py
      - name: Conferência da leitura (status de cada nota)
        run: python3 scripts/validar_camara_cg.py
      - name: Resumo (só contagens no log — nada de imagens nem artefato; páginas só no repositório privado)
        run: |
          python3 - <<'EOF'
          import json
          r = json.load(open("dados/camara_cg_revisao.json", encoding="utf-8"))["resumo"]
          print("status das notas:", r.get("statusNotas"))
          print("não verificado por motivo:", r.get("naoVerificadoPorMotivo"))
          print("métodos que resolveram:", r.get("metodosConfere"))
          EOF
