name: Testar site

# Teste de fumaça do painel a cada mudança no HTML/scripts (pega erro de
# edição manual antes que alguém perceba no site). Também roda à mão.
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright (Chromium)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && break
            echo "⚠️ instalação do Chromium falhou (tentativa $i) — tentando de novo em 30 s"
            sleep 30; sudo apt-get update -q || true
          done
          npx playwright install chromium
      - name: Conferir as contas dos dados (somas, totais, CPF mascarado)
        run: python3 tests/test_integridade_dados.py

      - name: Variações, formato, fontes paradas e exposição de dados
        run: python3 tests/test_variacoes.py
      - name: Divergência registrada na conferência = aviso; sem registro = erro
        run: python3 tests/test_divergencia_registrada.py
      - name: Emendas — documento compartilhado entre emendas e nota sobre a fonte
        run: pip install -q requests && python3 tests/test_emendas_compartilhado.py
      - name: Prefeitura — órgão dos empenhos da UGE 0505F pela página do empenho
        run: pip install -q requests && python3 tests/test_prefeitura_semadi.py
      - name: Conferência na fonte — teto de tempo por base, ordem rotativa e aviso de 3 coletas sem conferência
        run: pip install -q requests && python3 tests/test_conferencia_orcamento.py
      - name: Conferência na fonte compara a versão que vai ao ar; execuções inválidas fora do ICP
        run: pip install -q requests pyyaml && python3 tests/test_protecao_conferencia.py

      - name: LGPD — nenhum CPF completo nos arquivos publicados (com e sem pontuação, em qualquer campo)
        run: python3 tests/test_cpf.py

      - name: LGPD — contenção (máscara e detector antes de cada artefato, só PDFs novos, privado/ fora do Git)
        run: python3 tests/test_contencao.py

      - name: API do Governo de MS — repetição em 401/429/5xx com token novo, sem token no log (API simulada)
        run: python3 tests/test_api_governo.py

      - name: Supersalários — checagem automática, lista de conferência manual e Clopper–Pearson (folha sintética)
        run: python3 tests/test_verificacao.py

      - name: Teto definido para todo mês de contracheque (config/teto.json)
        run: python3 tests/test_teto.py

      - name: Exceção temporária ao alerta da Prefeitura (pedido de LAI) — volta a ser erro sozinha
        run: python3 tests/test_excecoes_alertas.py

      - name: Limite de requisições da API da CGU (400/min de dia, 700/min de madrugada; relógio simulado)
        run: python3 tests/test_limite_cgu.py

      - name: Limite adaptativo de consultas ao PNCP (3 → 2 → 1 em 429; sobe após 5 min; Retry-After)
        run: python3 tests/test_pncp_limite.py

      - name: Site publicado = lista explícita (.github/site.txt), sem .md, com todas as URLs do sitemap
        run: python3 scripts/montar_site.py /tmp/_site

      - name: ICP — conferidores na fonte oficial (fonte simulada, sem rede)
        run: python3 tests/test_conferidores.py
      - name: Conferência de Supersalários — campo não informado e divergência com o Anexo VIII
        run: python3 tests/test_conferencia_campos.py

      - name: Câmara CG — mês de cada página dos PDFs
        run: python3 tests/test_camara_cg_mes.py

      - name: Senado de MS — titular e suplente que trocam no ano continuam no site (caso simulado)
        run: pip install -q requests && python3 tests/test_senado_suplente.py

      - name: LGPD — nenhum artefato do Actions com dado pessoal sem criptografia (artefato de repositório público é baixável)
        run: pip install -q pyyaml && python3 tests/test_artefatos.py

      - name: ICP metodologia 2.0 — cobertura, nível de evidência, tetos e regressão das 24 bases
        run: python3 tests/test_icp_metodologia.py

      - name: Monitoramento dos robôs — logs sintéticos, dimensão F e falhas intencionais na proteção da publicação
        run: |
          pip install -q requests
          python3 tests/test_monitoramento_robos.py

      - name: ICP — status, notas, tetos, histórico, páginas e integração
        run: python3 tests/test_icp.py

      - name: Testar o painel
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node tests/smoke.js http://localhost:8000/
          node tests/icp_pagina.js http://localhost:8000/
