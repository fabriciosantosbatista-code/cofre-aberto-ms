name: Instagram — post automático

# 26/11/2026: o post sai às 11h47 de Campo Grande (15h47 UTC) por um disparo externo — Cloudflare Worker
# cofre-disparo-coleta (infra/cloudflare-worker/disparo-coleta.js), origem "externo" —, porque o agendador do GitHub
# atrasa horas. O agendamento do GitHub no mesmo horário fica só como RESERVA: se o post do dia já saiu, encerra sozinho.
# Usa os dados que estão no site (se a coleta do dia ainda não publicou, os do dia anterior). Também dá para rodar à mão
# em Actions → Run workflow.
# instagram/config.json: "publicar" (true = publica direto; false = pausa, só confere a chave) e "aprovacaoAte" (null =
# sem aprovação; com data, cada post vira uma issue e só sai com o rótulo "aprovado" — desligado em 25/11/2026).
# Regras de conteúdo em scripts/gerar_posts_instagram.py; no máximo 1 post por dia; a chave é conferida todo dia.
run-name: "Instagram — post automático — ${{ github.event_name == 'schedule' && 'agendada (reserva do GitHub)' || github.event_name == 'issues' && 'aprovação' || inputs.origem || 'manual' }}"

on:
  schedule:
    - cron: '47 15 * * *'
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      origem:
        description: 'Quem disparou: "externo" (Cloudflare Worker, o post do dia) ou "manual"'
        required: false
        default: 'manual'
      tema:
        description: 'Tema (vazio = o próximo da fila): precos, shows, obras, vereadores, publicidade, entidades, emendas, supersalarios'
        required: false
        default: ''
      so_conferir:
        description: 'Só conferir a chave do Instagram (consulta só de leitura; não gera nem publica nada)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  actions: write   # disparar a publicação do site depois de gravar as imagens

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  post:
    # pelo rótulo: só quando o rótulo posto é "aprovado" numa issue de rascunho do Instagram
    if: github.event_name != 'issues' || (github.event.label.name == 'aprovado' && contains(github.event.issue.labels.*.name, 'instagram-rascunho'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests Pillow

      - name: Conferir a chave do Instagram (só leitura; se a Meta recusar, o job falha e o GitHub avisa)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841400153468200"
        run: python3 -u scripts/publicar_instagram.py --conferir

      - name: Post do dia — disparo externo ou reserva
        id: dia
        if: github.event.inputs.so_conferir != 'true'
        env:
          EVENTO: ${{ github.event_name == 'workflow_dispatch' && inputs.origem == 'externo' && 'externo' || github.event_name }}
        run: python3 scripts/publicar_instagram.py --dia

      - name: Modo aprovação — o que fazer hoje
        id: estado
        if: github.event.inputs.so_conferir != 'true' && steps.dia.outputs.seguir == '1'
        run: python3 scripts/instagram_aprovacao.py estado

      - name: Gerar o post da vez (imagens + legenda)
        if: steps.estado.outputs.acao == 'gerar_rascunho' || steps.estado.outputs.acao == 'publicar_direto'
        run: python3 scripts/gerar_posts_instagram.py ${{ github.event.inputs.tema }}

      # o commit do robô (GITHUB_TOKEN) não dispara "push"; sem publicar o site aqui, as imagens novas só iriam ao ar
      # depois do fim deste workflow, e o post esperaria por elas até desistir (26/11/2026)
      - name: Publicar as imagens no site
        if: github.event.inputs.so_conferir != 'true' && steps.dia.outputs.seguir == '1'
        run: |
          git config user.name "Cofre Aberto (robô)"
          git config user.email "noreply@github.com"
          git add -A instagram/
          if git diff --cached --quiet; then echo "imagens sem mudança"; exit 0; fi
          git commit -m "Instagram: imagens do post de $(TZ=America/Campo_Grande date +%d/%m)"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin main && break; sleep $((i*10)); done
          gh workflow run publicar-site.yml --ref main && echo "▶️ publicação do site disparada para as imagens novas"

      - name: Abrir a issue do rascunho para aprovação (não publica)
        if: steps.estado.outputs.acao == 'gerar_rascunho'
        run: python3 scripts/instagram_aprovacao.py abrir

      - name: Publicar no Instagram
        if: steps.estado.outputs.acao == 'publicar_aprovado' || steps.estado.outputs.acao == 'publicar_direto'
        env:
          IG_APROVADO: ${{ steps.estado.outputs.acao == 'publicar_aprovado' && '1' || '0' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_USER_ID: "17841400153468200"   # @cofre_abertoms (ID público da conta; não é segredo)
        run: python3 -u scripts/publicar_instagram.py

      - name: Guardar o histórico
        if: github.event.inputs.so_conferir != 'true' && steps.dia.outputs.seguir == '1'
        run: |
          git add -A instagram/
          git diff --cached --quiet && exit 0
          git commit -m "Instagram: post publicado"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin main && break; sleep $((i*10)); done

      - name: Fechar a issue do rascunho aprovado
        if: steps.estado.outputs.acao == 'publicar_aprovado'
        run: |
          if python3 -c "import json,sys;h=json.load(open('instagram/historico.json'));p=json.load(open('instagram/proximo.json'));sys.exit(0 if any(x.get('imagens')==p['imagens'] for x in h['publicados']) else 1)"; then
            python3 scripts/instagram_aprovacao.py fechar ${{ steps.estado.outputs.issue }}
          else
            echo "⚠️ o post aprovado não foi publicado (veja o passo anterior) — a issue fica aberta"
          fi
