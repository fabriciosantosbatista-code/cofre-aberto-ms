name: Diagnóstico dos municípios (só leitura)

# Descobre e testa, a partir do runner, os portais de transparência das prefeituras e câmaras dos 79 municípios de MS
# e as fontes nacionais (Siconfi, PNCP) de cada um. Não grava nada no repositório nem gera artefato: o resultado sai
# só no log (uma linha "MUN|{json}" por município). Ver scripts/diagnostico_municipios.py.
on:
  workflow_dispatch:
    inputs:
      passada:
        description: "1 = descoberta dos portais; 2 = Fiorilli (JSON por entidade), Siconfi e PNCP; 3 = TCE-MS (portais e endpoints); 4 = TCE-MS (chamadas de API nos JS); 5 = Anexo VIII do TRT24 de 08/2026; 6 = Emendas: 3 divergências de 19/11 (arquivo da CGU × API)"
        default: "1"
        required: true

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Diagnóstico (só leitura)
        env:
          DIAG: ${{ inputs.passada }}
          # só a 6ª passada usa a API da CGU (leitura; a chave não aparece no log)
          PORTAL_TRANSPARENCIA_API_KEY: ${{ inputs.passada == '6' && secrets.PORTAL_TRANSPARENCIA_API_KEY || '' }}
        run: python3 -u scripts/diagnostico_municipios.py
