name: Publicar o site

# Publica cofreabertoms.com.br com actions/deploy-pages, só com o que está em .github/site.txt (lista explícita:
# nenhum .md da raiz, nem scripts/, tests/, config/ ou docs/). Requer Settings → Pages → Source: "GitHub Actions".
# Os commits dos robôs são feitos com o GITHUB_TOKEN e não disparam "push"; por isso também roda quando termina
# cada workflow que grava no main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Atualizar dados diariamente", "Instagram — post automático", "Aplicar fotos corretas", "Câmara CG — releitura com OCR"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; a seguinte espera (não cancela a que está no ar)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Checkout (main mais recente)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Montar o site (lista explícita) e conferir o sitemap
        run: python3 scripts/montar_site.py _site

      - name: Enviar o pacote do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 25/11/2026: o GitHub às vezes não encontra o pacote recém-enviado ("No artifacts named github-pages") —
      # falha intermitente do serviço; 4 publicações seguidas falharam assim. Agora há uma 2ª tentativa depois de 1 min.
      - name: Publicar
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar 1 minuto antes da 2ª tentativa
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "⚠️ a 1ª tentativa de publicar falhou — nova tentativa em 60 s"
          sleep 60

      - name: Publicar (2ª tentativa)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
