name: Publicar o site

# Publica cofreabertoms.com.br com actions/deploy-pages, só com o que está em .github/site.txt (lista explícita:
# nenhum .md da raiz, nem scripts/, tests/, config/ ou docs/). Requer Settings → Pages → Source: "GitHub Actions".
# Os commits dos robôs são feitos com o GITHUB_TOKEN e não disparam "push"; por isso também roda quando termina
# cada workflow que grava no main.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Atualizar dados diariamente", "Instagram — post automático", "Aplicar fotos corretas", "Câmara CG — releitura com OCR"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # conferir que o pacote já aparece na API antes de publicar

# uma publicação por vez; a seguinte espera (não cancela a que está no ar)
concurrency:
  group: pages
  cancel-in-progress: false

# 26/11/2026 — causa do "No artifacts named github-pages" na 1ª tentativa: o envio do pacote e a publicação rodavam no
# mesmo job; o deploy-pages consultava a lista de pacotes da execução ~0,4 s depois do envio terminar, e a API ainda não
# mostrava o pacote (ela leva alguns segundos para refletir um envio novo). Agora segue o modelo oficial do GitHub:
# um job monta e envia, outro publica; antes de publicar, espera o pacote aparecer na API (até 2 min).
# A 2ª tentativa fica só como segurança.
jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (main mais recente)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Montar o site (lista explícita) e conferir o sitemap
        run: python3 scripts/montar_site.py _site

      - name: Enviar o pacote do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Esperar o pacote aparecer na API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" -q '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "✅ pacote github-pages visível na API (após $(( (i-1)*5 )) s)"; exit 0; fi
            sleep 5
          done
          echo "⚠️ o pacote não apareceu na API em 2 min — tentando publicar assim mesmo"

      - name: Publicar
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Esperar 1 minuto antes da 2ª tentativa
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "⚠️ a 1ª tentativa de publicar falhou — nova tentativa em 60 s"
          sleep 60

      - name: Publicar (2ª tentativa)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
